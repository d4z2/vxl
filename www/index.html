<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Luyện thi Kỹ thuật vi xử lý</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F3F5F8; --card:#FFFFFF; --ink:#12233B; --muted:#54657C; --line:#D3DBE6;
  --mask:#123B6B; --mask-ink:#FFFFFF; --mask-soft:#E4ECF6;
  --gold:#E2B02E; --gold-ink:#7A5806;
  --ok:#1B7A4B; --ok-bg:#E2F3E9; --bad:#B3261E; --bad-bg:#FBE6E4;
  --code-bg:#EEF2F7;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,"Courier New",monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0B1424; --card:#122039; --ink:#E5ECF6; --muted:#9DB0C8; --line:#26385A;
    --mask:#7DB0F2; --mask-ink:#0B1424; --mask-soft:#1A2D4D;
    --gold:#E7B93F; --gold-ink:#F0CB6A;
    --ok:#5FCB92; --ok-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1816;
    --code-bg:#0D1830;
  }
}
:root[data-theme="dark"]{
  --paper:#0B1424; --card:#122039; --ink:#E5ECF6; --muted:#9DB0C8; --line:#26385A;
  --mask:#7DB0F2; --mask-ink:#0B1424; --mask-soft:#1A2D4D;
  --gold:#E7B93F; --gold-ink:#F0CB6A;
  --ok:#5FCB92; --ok-bg:#12301F; --bad:#FF8F85; --bad-bg:#3A1816;
  --code-bg:#0D1830;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 56px}
.wrap.wide{max-width:1060px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.bar-in{max-width:1060px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:12px;min-height:54px}
.brand{font-weight:600;font-size:15px;letter-spacing:.01em;margin-right:auto;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand i{font:600 12px var(--mono);font-style:normal;background:var(--mask);color:var(--mask-ink);padding:3px 6px;border-radius:3px}
.timer{font:500 15px var(--mono);padding:4px 10px;border:1px solid var(--line);border-radius:4px;background:var(--card)}
.timer.low{color:var(--bad);border-color:var(--bad)}
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:6px;font-weight:500;line-height:1.3}
.btn:hover{border-color:var(--mask)}
.btn.pri{background:var(--mask);color:var(--mask-ink);border-color:var(--mask)}
.btn.pri:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:34px 0 8px;font-weight:600;letter-spacing:-.01em}
h2{font-size:20px;margin:36px 0 12px;font-weight:600}
p{margin:0 0 12px}
.lead{color:var(--muted);font-size:17px;max-width:60ch}
.note{border-left:4px solid var(--gold);background:var(--card);padding:12px 16px;border-radius:0 6px 6px 0;margin:22px 0;font-size:15px;color:var(--muted)}
.note b{color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:6px}
.tile:hover{border-color:var(--mask)}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--mask);color:var(--mask-ink);border-color:var(--mask)}
.chip small{opacity:.75;margin-left:4px;font-family:var(--mono)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stat{display:flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist td,.hist th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.hist th{color:var(--muted);font-weight:500}
.mono{font-family:var(--mono)}
/* quiz */
.quiz{display:grid;gap:18px;padding-top:18px}
@media(min-width:960px){.quiz{grid-template-columns:minmax(0,1fr) 270px;align-items:start}.nav-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 72px)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px}
.qmeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.qmeta .no{font:600 14px var(--mono);color:var(--ink)}
.tag{border:1px solid var(--line);padding:1px 8px;border-radius:999px}
.tag.warn{border-color:var(--gold);color:var(--gold-ink);background:transparent}
.stem p{margin:0 0 10px;font-size:17px}
pre.code{margin:10px 0 14px;padding:12px 14px;background:var(--code-bg);border-left:3px solid var(--mask);border-radius:0 4px 4px 0;font:400 14px/1.55 var(--mono);overflow-x:auto;white-space:pre}
.fig{margin:10px 0 14px;overflow-x:auto;background:#fff;border:1px solid var(--line);border-radius:4px;padding:6px}
.fig img{display:block;max-width:none;height:auto;min-width:100%}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:11px 14px;background:var(--card);border:1.5px solid var(--line);border-radius:6px}
.opt:hover:not([disabled]){border-color:var(--mask)}
.opt .L{flex:none;width:28px;height:28px;display:grid;place-items:center;border:1.5px solid var(--line);border-radius:3px;font:600 13px var(--mono);margin-top:1px}
.opt.sel{border-color:var(--mask);background:var(--mask-soft)}
.opt.sel .L{background:var(--mask);color:var(--mask-ink);border-color:var(--mask)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.ok .L{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.bad .L{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}
.opt img{display:block;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:3px;padding:4px}
.fill{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.fill input{flex:1 1 180px;min-width:0;padding:10px 12px;font:500 17px var(--mono);border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);text-transform:uppercase}
.fill input.ok{border-color:var(--ok);background:var(--ok-bg)}
.fill input.bad{border-color:var(--bad);background:var(--bad-bg)}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.expl{margin-top:16px;padding:12px 14px;border-radius:6px;background:var(--code-bg);font-size:15px}
.expl .v{font-weight:600}
.expl.ok .v{color:var(--ok)} .expl.bad .v{color:var(--bad)}
.expl .ans{font-family:var(--mono)}
.ctrl{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;align-items:center}
.ctrl .sp{margin-left:auto}
.navh{font-size:14px;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.pads{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.pad{position:relative;height:38px;border:1.5px solid var(--line);background:var(--card);border-radius:3px;font:500 13px var(--mono);padding:0}
.pad:hover{border-color:var(--mask)}
.pad.done{background:var(--mask);color:var(--mask-ink);border-color:var(--mask)}
.pad.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.pad.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.pad.cur{outline:3px solid var(--gold);outline-offset:1px}
.pad.flag::after{content:"";position:absolute;top:-1px;right:-1px;border:6px solid transparent;border-top-color:var(--gold);border-right-color:var(--gold)}
.legend{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:2px;border:1.5px solid var(--line);margin-right:5px;vertical-align:-1px}
.nav-toggle{display:inline-flex}
@media(min-width:960px){.nav-toggle{display:none}}
.nav-box{display:none}
.nav-box.open{display:block}
@media(min-width:960px){.nav-box{display:block}}
/* result */
.score{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:26px 0 6px}
.score .n{font:600 clamp(52px,12vw,84px)/1 var(--mono);letter-spacing:-.03em}
.score .d{font-size:20px;color:var(--muted)}
.bars{display:grid;gap:10px;margin:14px 0}
.bar-row{display:grid;grid-template-columns:minmax(120px,210px) 1fr 64px;gap:12px;align-items:center;font-size:14px}
.track{height:10px;background:var(--code-bg);border-radius:2px;overflow:hidden}
.fillbar{height:100%;background:var(--mask)}
dialog{border:1px solid var(--line);border-radius:8px;padding:22px;background:var(--card);color:var(--ink);max-width:420px;width:calc(100% - 32px)}
dialog::backdrop{background:rgba(5,12,24,.55)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media(max-width:560px){.bar-row{grid-template-columns:1fr 64px}.bar-row .track{grid-column:1/-1;order:3}}
</style>
</head>

n trúc & phần cứng 89C51","blocks":[{"t":"text","s":"Khi chân tín hiệu EA=‘0’ thì:"}],"opts":[["A","Vi điều khiển chỉ truy xuất các lệnh trong bộ nhớ chương trình bên ngoài."],["B","Vi điều khiển chỉ truy xuất các lệnh trong bộ nhớ chương trình bên trong."],["C","Vi điều khiển sẽ truy xuất các lệnh của cả trong lẫn ngoài của bộ nhớ chương trình."],["D","Vi điều khiển sẽ truy xuất các lệnh trong bộ nhớ chương trình bên trong, nhưng khi thanh ghi PC vượt quá phạm vi 4KB thì sẽ tự động truy xuất các lệnh của bộ nhớ chương trình bên ngoài."]],"figs":[],"optimg":[],"type":"mcq","ans":"A","expl":"EA = 0: chỉ dùng bộ nhớ chương trình ngoài.","unsure":false},{"id":243,"topic":"Kiến trúc & phần cứng 89C51","blocks":[{"t":"text","s":"Địa chỉ trên vùng RAM đặc biệt của thanh ghi ACC là:"}],"opts":[["A","E0H"],["B","A0H"],["C","80H"],["D","90H"]],"figs":[],"optimg":[],"type":"mcq","ans":"A","expl":"ACC có địa chỉ E0H.","unsure":false},{"id":244,"topic":"Lập trình Assembly","blocks":[{"t":"text","s":"Trên vi điều khiển 89C51, CPU sẽ căn cứ vào cờ trạng thái nào trên thanh ghi PSW để tiến hành điều chỉnh lại kết quả với các tính toán trong mã BCD."}],"opts":[["A","Cờ nhớ phụ AC"],["B","Cờ bẫy F"],["C","Cờ tràn OV"],["D","Cờ chẵn lẻ P"]],"figs":[],"optimg":[],"type":"mcq","ans":"A","expl":"Cờ AC phục vụ hiệu chỉnh thập phân (DA A).","unsure":false},{"id":245,"topic":"Mở rộng bộ nhớ","blocks":[{"t":"text","s":"Dung lượng bộ nhớ ROM mở rộng của vi điều khiển 89C51 trong mạch vẽ dưới đây là:"}],"opts":[["A","4Kx8bit"],["B","16Kx8bit"],["C","4Kx16bit"],["D","16Kx16bit"]],"figs":[15],"optimg":[],"type":"mcq","ans":"A","expl":"ROM có A0–A11 (12 đường) → 4K×8.","unsure":false},{"id":246,"topic":"Mở rộng bộ nhớ","blocks":[{"t":"text","s":"Khi mở rộng bộ nhớ RAM dữ liệu của vi điều khiển 89C51 lên tới 32Kx8bit, thì các chân địa chỉ của vi điều khiển sẽ là:"}],"opts":[["A","P0.0 – P0.7 và P2.0 – P2.6"],["B","P0.0 – P0.7 và P2.0 – P2.5"],["C","P0.0 – P0.4 và P2.0 – P2.7"],["D","P0.0 – P0.6 v <script>
(function(){
"use strict";
var D=JSON.parse(document.getElementById('data').textContent);
var Q={};D.q.forEach(function(q){Q[q.id]=q});
var TOPICS=[];D.q.forEach(function(q){if(TOPICS.indexOf(q.topic)<0)TOPICS.push(q.topic)});
var KEY='vxl-luyenthi-v1';
var store={stats:{},marks:[],hist:[]};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==='object'){store.stats=p.stats||{};store.marks=p.marks||[];store.hist=p.hist||[]}}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var app=document.getElementById('app'),barin=document.getElementById('barin');
var S=null,homeTopic='all',timerId=null;

/* ---------- logic ---------- */
function normF(s){return String(s).toUpperCase().replace(/\s+/g,'').replace(/H$/,'')}
function sameFill(a,b){var x=normF(a),y=normF(b);if(x===y)return true;
  if(/^[0-9A-F]+$/.test(x)&&/^[0-9A-F]+$/.test(y)&&!/^[01]{3}$/.test(y))return parseInt(x,16)===parseInt(y,16);return false}
function isRight(q,v){if(v==null||v==='')return false;if(q.type==='mcq')return v===q.ans;
  var acc=Array.isArray(q.ans)?q.ans:[q.ans];return acc.some(function(a){return sameFill(v,a)})}
function ansText(q){var a=Array.isArray(q.ans)?q.ans[0]:q.ans;
  if(q.type==='fill')return a;
  var o=q.opts.filter(function(x){return x[0]===a})[0];return a+(o&&o[1]?'. '+o[1]:'')}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function rec(id,ok){var s=store.stats[id]||{r:0,w:0};if(ok)s.r++;else s.w++;s.last=ok?'r':'w';store.stats[id]=s;save()}
function fmt(sec){sec=Math.max(0,sec);var m=Math.floor(sec/60),s=sec%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s}
function stop(){if(timerId){clearInterval(timerId);timerId=null}}

function start(cfg){
  stop();
  S={mode:cfg.mode,title:cfg.title,ids:cfg.ids.slice(),i:0,ans:{},shown:{},flags:{},t0:Date.now(),dur:cfg.dur||0,done:false,only:false,navOpen:false,spent:0};
  if(S.dur){timerId=setInterval(tick,1000)}
  render();window.scrollTo(0,0);
}
function tick(){
  if(!S||S.done||!S.dur){stop();return}
  var left=S.dur-Math.floor((Date.now()-S.t0)/1000);
  var t=document.getElementById('tm');
  if(t){t.textContent=fmt(left);t.classList.toggle('low',left<=300)}
  if(left<=0){submit()}
}
function submit(){
  if(!S||S.done)return;
  stop();S.done=true;S.spent=Math.floor((Date.now()-S.t0)/1000);S.i=0;
  var c=0;
  S.ids.forEach(function(id){var q=Q[id],v=S.ans[id];
    if(isRight(q,v))c++;
    if(S.mode==='exam'&&v!=null&&v!==''){rec(id,isRight(q,v))}
    else if(S.mode==='exam'){rec(id,false)}
  });
  S.correct=c;
  store.hist.unshift({t:S.title,c:c,n:S.ids.length,m:S.mode,d:Date.now(),s:S.spent});
  store.hist=store.hist.slice(0,12);save();
  S.view='result';render();window.scrollTo(0,0);
}
function choose(v){
  var id=S.ids[S.i],q=Q[id];
  if(S.done||(S.mode==='practice'&&S.shown[id]))return;
  S.ans[id]=v;
  if(S.mode==='practice'&&q.type==='mcq'){S.shown[id]=true;rec(id,isRight(q,v))}
  render(true);
}
function check(){
  var id=S.ids[S.i],q=Q[id];
  var inp=document.getElementById('fin');
  var v=inp?inp.value.trim():'';
  if(!v)return;
  S.ans[id]=v;
  if(S.mode==='practice'&&!S.shown[id]){S.shown[id]=true;rec(id,isRight(q,v))}
  render(true);
}
function giveUp(){var id=S.ids[S.i];if(!S.shown[id]){S.shown[id]=true;if(!S.ans[id])S.ans[id]='';rec(id,false)}render(true)}
function go(n){if(n<0||n>=S.ids.length)return;S.i=n;render();window.scrollTo(0,0)}
function revealed(id){return S.done||(S.mode==='practice'&&S.shown[id])}
function toggleMark(id){var k=store.marks.indexOf(id);if(k<0)store.marks.push(id);else store.marks.splice(k,1);save();render(true)}
function toggleFlag(id){S.flags[id]=!S.flags[id];render(true)}

function ask(msg,okLabel,cb){
  var d=document.getElementById('dlg');
  d.innerHTML='<p style="margin:0 0 16px">'+msg+'</p><div class="row" style="justify-content:flex-end"><button class="btn" id="dn">Quay lại</button><button class="btn pri" id="dy">'+esc(okLabel)+'</button></div>';
  d.querySelector('#dn').onclick=function(){d.close()};
  d.querySelector('#dy').onclick=function(){d.close();cb()};
  if(d.showModal)d.showModal();else d.setAttribute('open','');
}

/* ---------- views ---------- */
function setBar(html){barin.innerHTML=html}
function homeBar(){setBar('<button class="brand" data-a="home"><i>8051</i>Luyện thi Vi xử lý</button>')}

function poolFor(kind){
  var ids=D.q.map(function(q){return q.id});
  if(homeTopic!=='all')ids=ids.filter(function(i){return Q[i].topic===homeTopic});
  if(kind==='wrong')ids=ids.filter(function(i){var s=store.stats[i];return s&&s.last==='w'});
  if(kind==='marks')ids=ids.filter(function(i){return store.marks.indexOf(i)>=0});
  if(kind==='fresh')ids=ids.filter(function(i){return !store.stats[i]});
  return ids;
}
function viewHome(){
  homeBar();
  var total=D.q.length,done=Object.keys(store.stats).length;
  var h='<div class="wrap">';
  h+='<h1>Luyện thi Kỹ thuật vi xử lý</h1>';
  h+='<p class="lead">'+total+' câu khác nhau từ '+D.exams.length+' đề kiểm tra (vi điều khiển 89C51, lập trình Assembly, Timer, ngắt, truyền thông nối tiếp). Làm thử theo đề có tính giờ hoặc luyện từng chủ đề, xem đáp án ngay.</p>';
  h+='<div class="note"><b>Về đáp án.</b> Các đề gốc không kèm đáp án nên đáp án và lời giải ở đây do Claude tự tính theo tập lệnh 89C51 và tra sơ đồ mạch. Câu có nhãn <b>Cần kiểm tra</b> là câu đề có dấu hiệu sai hoặc thiếu đáp án đúng, hãy đối chiếu với giáo trình hoặc giảng viên.</div>';
  h+='<div class="stat">Đã làm '+done+'/'+total+' câu</div>';
  h+='<h2>Thi thử theo đề</h2><p style="color:var(--muted);font-size:15px;margin-top:-4px">40 câu, 60 phút, chỉ hiện đáp án sau khi nộp bài.</p><div class="grid">';
  D.exams.forEach(function(e,i){h+='<button class="tile" data-a="exam" data-i="'+i+'"><b>'+esc(e.name)+'</b><span>'+e.ids.length+' câu · 60 phút</span></button>'});
  h+='<button class="tile" data-a="rand"><b>Đề ngẫu nhiên</b><span>40 câu trộn từ cả ngân hàng</span></button></div>';
  h+='<h2>Luyện tập theo chủ đề</h2><div class="chips" role="group" aria-label="Chủ đề">';
  h+='<button class="chip" data-a="topic" data-t="all" aria-pressed="'+(homeTopic==='all')+'">Tất cả<small>'+total+'</small></button>';
  TOPICS.forEach(function(t){var n=D.q.filter(function(q){return q.topic===t}).length;
    h+='<button class="chip" data-a="topic" data-t="'+esc(t)+'" aria-pressed="'+(homeTopic===t)+'">'+esc(t)+'<small>'+n+'</small></button>'});
  h+='</div><div class="row">';
  var nAll=poolFor('all').length,nW=poolFor('wrong').length,nM=poolFor('marks').length,nF=poolFor('fresh').length;
  h+='<button class="btn pri" data-a="prac" data-k="all"'+(nAll?'':' disabled')+'>Luyện '+nAll+' câu (trộn)</button>';
  h+='<button class="btn" data-a="prac" data-k="fresh"'+(nF?'':' disabled')+'>Câu chưa làm ('+nF+')</button>';
  h+='<button class="btn" data-a="prac" data-k="wrong"'+(nW?'':' disabled')+'>Ôn câu đã sai ('+nW+')</button>';
  h+='<button class="btn" data-a="prac" data-k="marks"'+(nM?'':' disabled')+'>Câu đã đánh dấu ('+nM+')</button>';
  h+='</div>';
  if(store.hist.length){
    h+='<h2>Lần làm gần đây</h2><div style="overflow-x:auto"><table class="hist"><thead><tr><th>Bài</th><th>Kết quả</th><th>Thời gian</th><th>Ngày</th></tr></thead><tbody>';
    store.hist.slice(0,6).forEach(function(r){var dt=new Date(r.d);
      h+='<tr><td>'+esc(r.t)+'</td><td class="mono">'+r.c+'/'+r.n+(r.m==='exam'?' ('+(r.c/r.n*10).toFixed(1)+')':'')+'</td><td class="mono">'+fmt(r.s||0)+'</td><td>'+dt.getDate()+'/'+(dt.getMonth()+1)+'</td></tr>'});
    h+='</tbody></table></div>';
  }
  h+='<h2>Tiến độ theo chủ đề</h2><div class="bars">';
  TOPICS.forEach(function(t){var ids=D.q.filter(function(q){return q.topic===t});var seen=0,right=0;
    ids.forEach(function(q){var s=store.stats[q.id];if(s){seen++;if(s.last==='r')right++}});
    h+='<div class="bar-row"><span>'+esc(t)+'</span><div class="track"><div class="fillbar" style="width:'+(right/ids.length*100)+'%"></div></div><span class="mono">'+right+'/'+ids.length+'</span></div>'});
  h+='</div><p class="hint">Thanh thể hiện số câu bạn đã làm đúng ở lần gần nhất. Tiến độ lưu trên trình duyệt này.</p>';
  h+='</div>';
  app.innerHTML=h;
}

function qHTML(q,idx){
  var id=q.id,rev=revealed(id),v=S.ans[id],right=isRight(q,v);
  var h='<div class="card"><div class="qmeta"><span class="no">Câu '+(idx+1)+'/'+S.ids.length+'</span><span class="tag">'+esc(q.topic)+'</span>';
  if(q.unsure&&rev)h+='<span class="tag warn">Cần kiểm tra</span>';
  h+='<span class="sp" style="margin-left:auto"></span><button class="btn sm" data-a="mark" aria-pressed="'+(store.marks.indexOf(id)>=0)+'">'+(store.marks.indexOf(id)>=0?'Bỏ lưu':'Lưu câu này')+'</button></div>';
  h+='<div class="stem">';
  q.blocks.forEach(function(b){h+=b.t==='code'?'<pre class="code">'+esc(b.s)+'</pre>':'<p>'+esc(b.s)+'</p>'});
  h+='</div>';
  q.figs.forEach(function(f){h+='<div class="fig"><img src="'+D.imgs[f]+'" alt="Sơ đồ mạch của đề bài"></div>'});
  if(q.type==='mcq'){
    h+='<div class="opts" role="radiogroup">';
    q.opts.forEach(function(o,k){
      var L=o[0],cls='opt';
      if(rev){if(L===q.ans)cls+=' ok';else if(L===v)cls+=' bad'}
      else if(L===v)cls+=' sel';
      h+='<button class="'+cls+'" data-a="opt" data-v="'+L+'" role="radio" aria-checked="'+(L===v)+'"'+((rev)?' disabled':'')+'><span class="L">'+L+'</span><span>'+(q.optimg.length?'<img src="'+D.imgs[q.optimg[k]]+'" alt="Phương án '+L+'">':esc(o[1]))+'</span></button>'});
    h+='</div>';
  }else{
    var cls=rev?(right?'ok':'bad'):'';
    h+='<div class="fill"><input id="fin" class="'+cls+'" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Nhập đáp án" value="'+esc(v||'')+'"'+(rev?' disabled':'')+' aria-label="Đáp án điền khuyết">';
    if(!rev&&S.mode==='practice')h+='<button class="btn pri" data-a="check">Kiểm tra</button>';
    h+='</div>';
    if(!rev)h+='<div class="hint">Viết số hex không cần chữ H (ví dụ 7E hoặc 7EH đều được).</div>';
  }
  if(rev){
    var okk=right;
    h+='<div class="expl '+(okk?'ok':'bad')+'"><span class="v">'+(v==null||v===''?'Bạn chưa trả lời. ':(okk?'Đúng. ':'Chưa đúng. '))+'</span>Đáp án: <span class="ans">'+esc(ansText(q))+'</span>'+(q.expl?'<div style="margin-top:6px">'+esc(q.expl)+'</div>':'')+(q.unsure?'<div style="margin-top:6px;color:var(--gold-ink)">Câu này đề có dấu hiệu sai hoặc không có đáp án khớp hoàn toàn; đáp án trên là đáp án hợp lý nhất, nên đối chiếu thêm.</div>':'')+'</div>';
  }
  h+='<div class="ctrl"><button class="btn" data-a="prev"'+(S.i===0?' disabled':'')+'>Câu trước</button>';
  h+='<button class="btn pri" data-a="next"'+(S.i===S.ids.length-1?' disabled':'')+'>Câu sau</button>';
  if(!S.done)h+='<button class="btn" data-a="flag" aria-pressed="'+(!!S.flags[id])+'">'+(S.flags[id]?'Bỏ đánh dấu xem lại':'Đánh dấu xem lại')+'</button>';
  if(S.mode==='practice'&&!rev&&!S.done&&q.type==='fill')h+='<button class="btn sp" data-a="giveup">Xem đáp án</button>';
  h+='</div></div>';
  return h;
}
function padsHTML(){
  var h='<div class="pads">';
  S.ids.forEach(function(id,k){
    var q=Q[id],c='pad',rev=revealed(id);
    if(rev&&S.ans[id]!=null&&(S.ans[id]!==''||S.done)){c+=isRight(q,S.ans[id])?' ok':' bad'}
    else if(rev){c+=' bad'}
    else if(S.ans[id]!=null&&S.ans[id]!=='')c+=' done';
    if(S.flags[id])c+=' flag';
    if(k===S.i)c+=' cur';
    h+='<button class="'+c+'" data-a="go" data-n="'+k+'" aria-label="Câu '+(k+1)+'">'+(k+1)+'</button>'});
  return h+'</div>';
}
function viewQuiz(keep){
  var id=S.ids[S.i],q=Q[id];
  var answered=S.ids.filter(function(i){return S.ans[i]!=null&&S.ans[i]!==''}).length;
  var bar='<button class="brand" data-a="exit"><i>8051</i>'+esc(S.title)+'</button>';
  if(S.dur&&!S.done)bar+='<span class="timer" id="tm">'+fmt(S.dur-Math.floor((Date.now()-S.t0)/1000))+'</span>';
  bar+='<button class="btn sm nav-toggle" data-a="navt">Danh sách câu</button>';
  if(S.mode==='exam'&&!S.done)bar+='<button class="btn pri sm" data-a="submit">Nộp bài</button>';
  if(S.done)bar+='<button class="btn sm" data-a="result">Kết quả</button>';
  setBar(bar);
  var nav='<div class="nav-box'+(S.navOpen?' open':'')+'"><div class="card"><div class="navh"><span>'+(S.done?'Kết quả từng câu':'Đã trả lời '+answered+'/'+S.ids.length)+'</span></div>'+padsHTML()+
    '<div class="legend">'+(S.done||S.mode==='practice'?'<span><i style="background:var(--ok-bg);border-color:var(--ok)"></i>Đúng</span><span><i style="background:var(--bad-bg);border-color:var(--bad)"></i>Sai</span>':'<span><i style="background:var(--mask);border-color:var(--mask)"></i>Đã trả lời</span>')+'<span><i style="border-color:var(--gold)"></i>Đang xem</span></div></div></div>';
  var h='<div class="wrap wide"><div class="quiz"><div>'+qHTML(q,S.i)+'</div><aside class="nav-side">'+nav+'</aside></div></div>';
  var y=window.scrollY;
  app.innerHTML=h;
  if(keep)window.scrollTo(0,y);
  var f=document.getElementById('fin');if(f&&!f.disabled&&!keep){}
}
function viewResult(){
  setBar('<button class="brand" data-a="exit"><i>8051</i>'+esc(S.title)+'</button><button class="btn sm" data-a="home">Trang chủ</button>');
  var n=S.ids.length,c=S.correct,h='<div class="wrap">';
  var score=(c/n*10).toFixed(1);
  h+='<div class="score"><span class="n">'+(S.mode==='exam'?score:c+'/'+n)+'</span><span class="d">'+(S.mode==='exam'?'điểm (thang 10) · '+c+'/'+n+' câu đúng':'câu đúng')+'</span></div>';
  h+='<p class="lead">Thời gian làm bài: <span class="mono">'+fmt(S.spent)+'</span>.</p>';
  var by={};S.ids.forEach(function(id){var q=Q[id];by[q.topic]=by[q.topic]||{c:0,n:0};by[q.topic].n++;if(isRight(q,S.ans[id]))by[q.topic].c++});
  h+='<h2>Theo chủ đề</h2><div class="bars">';
  Object.keys(by).forEach(function(t){var b=by[t];h+='<div class="bar-row"><span>'+esc(t)+'</span><div class="track"><div class="fillbar" style="width:'+(b.c/b.n*100)+'%"></div></div><span class="mono">'+b.c+'/'+b.n+'</span></div>'});
  h+='</div>';
  var wrong=S.ids.filter(function(id){return !isRight(Q[id],S.ans[id])});
  h+='<div class="row" style="margin-top:20px"><button class="btn pri" data-a="review">Xem lại đáp án từng câu</button>';
  if(wrong.length)h+='<button class="btn" data-a="redo">Luyện lại '+wrong.length+' câu sai</button>';
  h+='<button class="btn" data-a="home">Về trang chủ</button></div>';
  if(wrong.length){
    h+='<h2>Các câu cần xem lại</h2><div class="pads" style="max-width:520px">';
    wrong.forEach(function(id){var k=S.ids.indexOf(id);h+='<button class="pad bad" data-a="rv" data-n="'+k+'">'+(k+1)+'</button>'});
    h+='</div>';
  }
  h+='</div>';app.innerHTML=h;
}
function render(keep){
  if(!S){viewHome();return}
  if(S.done&&S.view==='result'){viewResult();return}
  viewQuiz(keep);
}
function goHome(){stop();S=null;render();window.scrollTo(0,0)}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  var a=t.getAttribute('data-a');
  if(a==='home')return (S&&!S.done&&S.mode==='exam')?ask('Thoát bài thi? Kết quả chưa nộp sẽ mất.','Thoát',goHome):goHome();
  if(a==='exit')return (S&&!S.done&&S.mode==='exam')?ask('Thoát bài thi? Kết quả chưa nộp sẽ mất.','Thoát',goHome):goHome();
  if(a==='exam'){var ex=D.exams[+t.getAttribute('data-i')];return start({mode:'exam',title:ex.name,ids:ex.ids,dur:3600})}
  if(a==='rand'){return start({mode:'exam',title:'Đề ngẫu nhiên',ids:shuffle(D.q.map(function(q){return q.id})).slice(0,40),dur:3600})}
  if(a==='topic'){homeTopic=t.getAttribute('data-t');return render()}
  if(a==='prac'){var ids=poolFor(t.getAttribute('data-k'));var nm={all:'Luyện tập',fresh:'Câu chưa làm',wrong:'Ôn câu sai',marks:'Câu đã lưu'}[t.getAttribute('data-k')];
    return start({mode:'practice',title:(homeTopic==='all'?'':homeTopic+' · ')+nm,ids:shuffle(ids)})}
  if(!S)return;
  if(a==='opt')return choose(t.getAttribute('data-v'));
  if(a==='check')return check();
  if(a==='giveup')return giveUp();
  if(a==='prev')return go(S.i-1);
  if(a==='next')return go(S.i+1);
  if(a==='go'){S.navOpen=false;return go(+t.getAttribute('data-n'))}
  if(a==='flag')return toggleFlag(S.ids[S.i]);
  if(a==='mark')return toggleMark(S.ids[S.i]);
  if(a==='navt'){S.navOpen=!S.navOpen;return render(true)}
  if(a==='submit'){var un=S.ids.filter(function(i){return S.ans[i]==null||S.ans[i]===''}).length;
    return ask(un?('Còn <b>'+un+'</b> câu chưa trả lời. Nộp bài ngay?'):'Nộp bài và xem kết quả?','Nộp bài',submit)}
  if(a==='result'){S.view='result';return render()}
  if(a==='review'){S.view='';S.i=0;return render()}
  if(a==='rv'){S.view='';return go(+t.getAttribute('data-n'))}
  if(a==='redo'){var w=S.ids.filter(function(id){return !isRight(Q[id],S.ans[id])});return start({mode:'practice',title:'Luyện lại câu sai',ids:shuffle(w)})}
});
document.addEventListener('keydown',function(e){
  if(!S||document.getElementById('dlg').open)return;
  var inInput=e.target&&e.target.tagName==='INPUT';
  if(inInput){if(e.key==='Enter'){e.preventDefault();if(S.mode==='practice')check();else go(S.i+1)}return}
  var q=Q[S.ids[S.i]];
  if(e.key==='ArrowRight'||e.key==='n')go(S.i+1);
  else if(e.key==='ArrowLeft'||e.key==='p')go(S.i-1);
  else if(q.type==='mcq'){var m={'a':'A','b':'B','c':'C','d':'D','1':'A','2':'B','3':'C','4':'D'}[e.key.toLowerCase()];if(m)choose(m)}
});
document.addEventListener('input',function(e){
  if(S&&e.target&&e.target.id==='fin'&&!S.done){var id=S.ids[S.i];S.ans[id]=e.target.value;
    if(S.mode==='exam'){var pad=document.querySelector('.pad.cur');if(pad){pad.classList.toggle('done',e.target.value.trim()!=='')}}}
});
render();
})();
</script>
